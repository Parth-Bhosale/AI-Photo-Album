version: 0.2
env:
  shell: bash
phases:
  pre_build:
    commands:
      - test -n "$FRONTEND_BUCKET"
      - test -n "$PHOTO_API_BASE_URL"
      - test -n "$PHOTO_API_KEY"
      - test -f frontend/index.html
      - |
        if [ ! -f frontend/sdk/apigClient.js ]; then
          echo "SDK dependencies not yet committed; importing installed SDK from the existing S3 site."
          aws s3 sync "s3://$FRONTEND_BUCKET/sdk/" frontend/sdk/
        fi
      - test -f frontend/sdk/apigClient.js
      - test -f frontend/sdk/lib/axios/dist/axios.standalone.js
      - test -f frontend/sdk/lib/apiGatewayCore/utils.js
  build:
    commands:
      - |
        python - <<'PY'
        import json, os
        from pathlib import Path
        Path("frontend/config.js").write_text(
          "window.PHOTO_APP_CONFIG = " +
          json.dumps({"apiBaseUrl": os.environ["PHOTO_API_BASE_URL"],
                      "apiKey": os.environ["PHOTO_API_KEY"]}) + ";\n"
        )
        PY
  post_build:
    commands:
      - aws s3 sync frontend/ "s3://$FRONTEND_BUCKET/" --delete --exclude '*.md' --exclude 'config.example.js'
