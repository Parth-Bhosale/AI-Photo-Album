version: 0.2
env:
  shell: bash
phases:
  pre_build:
    commands:
      - test -n "$FRONTEND_BUCKET"
      - test -n "$PHOTO_API_BASE_URL"
      - test -n "$PHOTO_API_KEY"
      - test -f front-end/index.html
      - test -f front-end/app.js
      - test -f front-end/style.css
      - test -f front-end/sdk/apigClient.js
      - test -f front-end/sdk/lib/axios/dist/axios.standalone.js
      - test -f front-end/sdk/lib/CryptoJS/rollups/crypto-js.js
      - test -f front-end/sdk/lib/CryptoJS/rollups/sha256.js
      - test -f front-end/sdk/lib/CryptoJS/components/hmac.js
      - test -f front-end/sdk/lib/CryptoJS/components/enc-base64.js
      - test -f front-end/sdk/lib/url-template/url-template.js
      - test -f front-end/sdk/lib/apiGatewayCore/sigV4Client.js
      - test -f front-end/sdk/lib/apiGatewayCore/apiGatewayClient.js
      - test -f front-end/sdk/lib/apiGatewayCore/simpleHttpClient.js
      - test -f front-end/sdk/lib/apiGatewayCore/utils.js
  build:
    commands:
      - |
        python - <<'PY'
        import json, os
        from pathlib import Path
        Path("front-end/config.js").write_text(
          "window.PHOTO_APP_CONFIG = " +
          json.dumps({"apiBaseUrl": os.environ["PHOTO_API_BASE_URL"],
                      "apiKey": os.environ["PHOTO_API_KEY"]}) + ";\n"
        )
        PY
  post_build:
    commands:
      - aws s3 sync front-end/ "s3://$FRONTEND_BUCKET/" --delete --exclude '*.md' --exclude 'config.example.js'

