AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Assignment 3 baseline (T1): photo and public frontend buckets, index/search
  Lambda functions, API Gateway S3 proxy upload and Lambda search endpoints.
  OpenSearch, Lex and CodePipeline are configured separately as allowed by the PDF.

Parameters:
  OpenSearchDomainName:
    Type: String
    Default: photos
    Description: Existing domain name for IAM permission scope (default photos).

Resources:
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadWebsiteObjects
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  IndexLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IndexPhotosAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub '${PhotosBucket.Arn}/*'
              - Effect: Allow
                Action: [rekognition:DetectLabels]
                Resource: '*'
              - Effect: Allow
                Action: ['es:ESHttpGet', 'es:ESHttpPut', 'es:ESHttpPost', 'es:ESHttpDelete']
                Resource: !Sub 'arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${OpenSearchDomainName}/*'

  SearchLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SearchPhotosAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub '${PhotosBucket.Arn}/*'
              - Effect: Allow
                Action: ['lex:RecognizeText']
                Resource: !Sub 'arn:aws:lex:${AWS::Region}:${AWS::AccountId}:bot-alias/*/*'
              - Effect: Allow
                Action: ['es:ESHttpGet', 'es:ESHttpPost']
                Resource: !Sub 'arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${OpenSearchDomainName}/*'

  IndexPhotosFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-index-photos'
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 45
      MemorySize: 256
      Role: !GetAtt IndexLambdaRole.Arn
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: REPLACE_WITH_OPENSEARCH_ENDPOINT
          OPENSEARCH_INDEX: photos
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              print(json.dumps(event))
              return {'statusCode': 200, 'body': json.dumps({'message': 'Deploy LF1 code'})}

  SearchPhotosFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-search-photos'
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 45
      MemorySize: 256
      Role: !GetAtt SearchLambdaRole.Arn
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: REPLACE_WITH_OPENSEARCH_ENDPOINT
          OPENSEARCH_INDEX: photos
          LEX_BOT_ID: REPLACE_WITH_BOT_ID
          LEX_BOT_ALIAS_ID: REPLACE_WITH_ALIAS_ID
          LEX_LOCALE_ID: en_US
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              return {'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'results': []})}

  ApiS3Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: apigateway.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: UploadPhotosOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub '${PhotosBucket.Arn}/*'

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-photo-search-api'
      Description: A3 S3-proxy upload + Lambda search API
      EndpointConfiguration:
        Types: [REGIONAL]
      BinaryMediaTypes: ['image/jpeg', 'image/png', 'image/jpg', 'application/octet-stream']

  PhotosResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: photos
      RestApiId: !Ref RestApi

  SearchResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: search
      RestApiId: !Ref RestApi

  UploadMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PhotosResource
      HttpMethod: PUT
      AuthorizationType: NONE
      ApiKeyRequired: true
      RequestParameters:
        method.request.querystring.key: true
        method.request.header.Content-Type: false
        method.request.header.x-amz-meta-customLabels: false
      Integration:
        Type: AWS
        IntegrationHttpMethod: PUT
        Credentials: !GetAtt ApiS3Role.Arn
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:s3:path/${PhotosBucket}/{key}'
        PassthroughBehavior: WHEN_NO_MATCH
        RequestParameters:
          integration.request.path.key: method.request.querystring.key
          integration.request.header.Content-Type: method.request.header.Content-Type
          integration.request.header.x-amz-meta-customLabels: method.request.header.x-amz-meta-customLabels
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  SearchMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref SearchResource
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      RequestParameters:
        method.request.querystring.q: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchPhotosFunction.Arn}/invocations'

  SearchInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SearchPhotosFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/search'

  UploadOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PhotosResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,PUT'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,x-api-key,x-amz-meta-customLabels'"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  SearchOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref SearchResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,GET'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,x-api-key'"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [UploadMethod, SearchMethod, UploadOptionsMethod, SearchOptionsMethod]
    Properties:
      RestApiId: !Ref RestApi
      Description: Initial deployment; redeploy when changing API method configurations.

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  ClassProjectApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true
      Name: !Sub '${AWS::StackName}-class-project-api-key'

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      UsagePlanName: !Sub '${AWS::StackName}-usage-plan'
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: !Ref ApiStage
      Throttle:
        RateLimit: 5
        BurstLimit: 10
      Quota:
        Limit: 2000
        Period: MONTH

  ApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ClassProjectApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

Outputs:
  FrontendBucketName:
    Description: Upload frontend assets into this bucket
    Value: !Ref FrontendBucket
  FrontendWebsiteURL:
    Description: Public S3 static website URL (HTTP; account-level public block may prevent access)
    Value: !GetAtt FrontendBucket.WebsiteURL
  PhotosBucketName:
    Value: !Ref PhotosBucket
  SearchLambdaName:
    Value: !Ref SearchPhotosFunction
  IndexLambdaName:
    Value: !Ref IndexPhotosFunction
  IndexLambdaRoleArn:
    Value: !GetAtt IndexLambdaRole.Arn
  SearchLambdaRoleArn:
    Value: !GetAtt SearchLambdaRole.Arn
  ApiBaseURL:
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  ApiKeyId:
    Description: Get the key VALUE privately in API Gateway console > API Keys
    Value: !Ref ClassProjectApiKey
